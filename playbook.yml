---

- name: Deploy LibCal ETL
  hosts: uda4
  remote_user: ulsprovision
  vars:
    app_folder: /var/opt/libcal-etl
    user: libappsetl

  tasks:
    - name: Grab env vars from env_vars.yml
      include_vars:
        file: env_vars.yml
        name: env_vars

    - name: Create dedicated user
      user:
        name: '{{ user }}'
        state: present
      become: yes

    - name: Create app folder with group permissions
      file:
        path: '{{ app_folder }}'
        state: directory
        recurse: yes
        group: ulssysdev
        owner: '{{ user }}'
        mode: '02770'
      become: yes

    - name: Download executable from github
      unarchive:
        src: https://github.com/ulsdevteam/libcal-etl/releases/download/v2.0.0/libcal-etl-2_0_0.zip
        dest: '{{ app_folder }}/libcal-etl'
        owner: '{{ user }}'
        mode: '0770'
        remote_src: true
      become: yes

    - name: Set environment variables
      lineinfile:
        dest: '{{ app_folder }}/libcal-etl/.env'
        state: present
        create: yes
        owner: '{{ user }}'
        regexp: '^export {{ item.key }}='
        line: 'export {{ item.key }}="{{ item.value }}"'
      with_items: '{{ env_vars | dict2items }}'
      become: yes

    - name: Schedule cron job for monthly (events and appointments) updates
      cron:
        name: 'LibCal ETL - Update events and appointments midpoint'
        hour: '4'
        minute: '0'
        day: '1'
        month: '1'
        job: "/usr/local/bin/cronic sh -c 'cd /var/opt/libcal-etl/; /var/opt/libcal-etl/libcal-etl update events,appointments'"
      become: yes
      become_user: '{{ user }}'

    - name: Schedule cron job for daily (spaces) updates
      cron:
        name: 'LibCal ETL - Update spaces monthly'
        hour: '5'
        minute: '30'
        day: '1'
        job: "/usr/local/bin/cronic sh -c 'source ~/.profile; {{ app_folder }}/libcal-etl update spaces'"
      become: yes
      become_user: '{{ user }}'

    - name: Schedule cron job for end-of-year updates
      cron:
        name: 'LibCal ETL - Update all after end of year'
        hour: '4'
        minute: '1'
        day: '1'
        month: '8'
        job: "/usr/local/bin/cronic sh -c 'cd /var/opt/libcal-etl/; Y=$(/bin/date +\%Y); /var/opt/libcal-etl/libcal-etl update all --from \"$(( Y - 1 ))-07-01\" --to \"$Y-06-30\"'"
      become: yes
      become_user: '{{ user }}'

    - name: Send mail to root
      lineinfile:
        dest: /etc/aliases
        regexp: '^{{ user }}:'
        line: '{{ user }}:    root'
      become: yes
